project:
  name: "manufacturing-surface-defect-detection"
  version: "1.0.0"
  description: "AI-Based Manufacturing Surface Defect Detection and Classification Using Custom CNN and Transfer Learning"

paths:
  raw_data_dir: "data/raw/NEU-CLS"
  processed_data_dir: "data/processed"
  splits_dir: "data/splits"
  models_dir: "models"
  results_dir: "results"
  metrics_dir: "results/metrics"
  confusion_matrices_dir: "results/confusion_matrices"
  training_curves_dir: "results/training_curves"
  gradcam_dir: "results/gradcam"
  database_path: "backend/inspections.db"

dataset:
  name: "NEU-CLS"
  num_classes: 6
  classes:
    - "crazing"
    - "inclusion"
    - "patches"
    - "pitted_surface"
    - "rolled-in_scale"
    - "scratches"
  image_size: [224, 224]
  channels: 3
  split_ratios:
    train: 0.70
    val: 0.15
    test: 0.15
  random_seed: 42

training:
  batch_size: 32
  custom_cnn:
    initial_lr: 0.001
    epochs: 40
    early_stopping_patience: 10
    reduce_lr_patience: 4
    reduce_lr_factor: 0.2
    dropout_rate: 0.5
  efficientnet_frozen:
    initial_lr: 0.0003
    epochs: 25
    early_stopping_patience: 8
    dropout_rate: 0.4
  efficientnet_finetuned:
    initial_lr: 0.00001
    epochs: 20
    unfreeze_top_blocks: 2
    early_stopping_patience: 6
  seeds_for_statistical_test:
    - 42
    - 101
    - 2024
    - 7
    - 99

augmentation:
  random_rotation: 0.05       # ~18 degrees
  random_translation_h: 0.08  # ~8%
  random_translation_w: 0.08  # ~8%
  random_zoom: 0.08           # ~8%
  random_flip: "horizontal_and_vertical"
  random_contrast: 0.15

serving:
  host: "127.0.0.1"
  port: 8000
  confidence_threshold_high: 0.85
  confidence_threshold_medium: 0.65
